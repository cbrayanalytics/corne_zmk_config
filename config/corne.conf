# RGB underglow disabled to preserve battery life
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# OLED display enabled
CONFIG_ZMK_DISPLAY=y

# Automatic deep sleep after idle (ZMK_SLEEP defaults to n upstream).
# Biggest battery win available; wakes on any keypress.
# ZMK_IDLE_SLEEP_TIMEOUT defaults to 900000ms (15 min).
CONFIG_ZMK_SLEEP=y

# Manual soft-off behavior, bound to &soft_off on the ADJUST layer.
# NOTE: no gpio-key-wakeup-trigger node is defined, so waking from soft-off
# currently requires the physical reset button.
CONFIG_ZMK_PM_SOFT_OFF=y

# Fix BLE disconnect on Linux/BlueZ — improves connection parameter negotiation
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Report the peripheral (right) half's battery to the host as well.
# Off by default upstream, so only the central half's level was visible.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Show the battery level as a number on the OLED, not just an icon.
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
